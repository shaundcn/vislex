name: Docker image

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
    paths:
      - "app/**"
      - "tests/**"
      - "deploy/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - "requirements.txt"
      - "LICENSE"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag without the v prefix, for example 1.1.2"
        required: true
        type: string
      publish_latest:
        description: "Also update the latest tag"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate shell and Compose files
        env:
          HOST_BIND_IP: 192.168.1.10
          HOST_PORT: "9602"
          PUID: "1000"
          PGID: "1000"
          VISLEX_TAG: latest
        run: |
          sh -n deploy/install.sh
          docker compose config
          docker compose -f deploy/compose.yaml config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: vislex:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compile and run unit tests
        run: |
          docker run --rm vislex:test python -m compileall app
          docker run --rm \
            -v "$PWD:/workspace:ro" \
            -w /workspace \
            vislex:test \
            python -m unittest discover -s tests -v
          identity_dir="$(mktemp -d)"
          mkdir -p "$identity_dir/input" "$identity_dir/output" "$identity_dir/data"
          touch "$identity_dir/input/keep-owner.mp4" "$identity_dir/output/keep-owner.md"
          input_owner="$(stat -c %u "$identity_dir/input/keep-owner.mp4")"
          output_owner="$(stat -c %u "$identity_dir/output/keep-owner.md")"
          docker run --rm \
            -e PUID=12345 \
            -e PGID=12345 \
            -v "$identity_dir/input:/app/input" \
            -v "$identity_dir/output:/app/output" \
            -v "$identity_dir/data:/app/data" \
            vislex:test \
            python -c 'import os; from pathlib import Path; assert (os.getuid(), os.getgid()) == (12345, 12345); Path("/app/data/identity-check").write_text("ok", encoding="utf-8")'
          test "$(stat -c %u "$identity_dir/input/keep-owner.mp4")" = "$input_owner"
          test "$(stat -c %u "$identity_dir/output/keep-owner.md")" = "$output_owner"
          test "$(stat -c %u "$identity_dir/data/identity-check")" = "12345"
          docker run --rm \
            --entrypoint python \
            --user 0:0 \
            -v "$identity_dir:/cleanup" \
            vislex:test \
            -c 'import shutil; [shutil.rmtree(f"/cleanup/{name}") for name in ("input", "output", "data")]'
          rmdir "$identity_dir"

      - name: Verify default identity and configurable port
        run: |
          runtime_dir="$(mktemp -d)"
          mkdir -p "$runtime_dir/input" "$runtime_dir/output" "$runtime_dir/data"

          wait_for_health() {
            port="$1"
            healthy=false
            for attempt in $(seq 1 30); do
              if docker exec "$container_id" python -c \
                "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${port}/healthz', timeout=3)"; then
                healthy=true
                break
              fi
              sleep 1
            done
            if [ "$healthy" != true ]; then
              docker logs "$container_id"
              docker stop "$container_id"
              return 1
            fi
          }

          container_id="$(docker run -d --rm \
            -v "$runtime_dir/input:/app/input" \
            -v "$runtime_dir/output:/app/output" \
            -v "$runtime_dir/data:/app/data" \
            vislex:test)"
          wait_for_health 9602
          docker exec "$container_id" python -c \
            'from pathlib import Path; status=Path("/proc/1/status").read_text(); assert "Uid:\t10001\t10001\t10001\t10001" in status; assert "Gid:\t10001\t10001\t10001\t10001" in status'
          docker stop "$container_id"

          container_id="$(docker run -d --rm \
            -e UVICORN_PORT=9090 \
            -v "$runtime_dir/input:/app/input" \
            -v "$runtime_dir/output:/app/output" \
            -v "$runtime_dir/data:/app/data" \
            vislex:test)"
          wait_for_health 9090
          docker stop "$container_id"

          docker run --rm \
            --entrypoint python \
            --user 0:0 \
            -v "$runtime_dir:/cleanup" \
            vislex:test \
            -c 'import shutil; [shutil.rmtree(f"/cleanup/{name}") for name in ("input", "output", "data")]'
          rmdir "$runtime_dir"

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs:
      - test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve release version
        id: release
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          DISPATCH_LATEST: ${{ inputs.publish_latest }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            publish_latest=true
          else
            version="$DISPATCH_VERSION"
            publish_latest="$DISPATCH_LATEST"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use X.Y.Z format" >&2
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "publish_latest=$publish_latest" >>"$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: shaundcn
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Refuse to overwrite a fixed version
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if docker buildx imagetools inspect "docker.io/shaundcn/vislex:${VERSION}" >/dev/null 2>&1; then
            echo "docker.io/shaundcn/vislex:${VERSION} already exists" >&2
            exit 1
          fi

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: docker.io/shaundcn/vislex
          tags: |
            type=raw,value=${{ steps.release.outputs.version }}
            type=raw,value=latest,enable=${{ steps.release.outputs.publish_latest == 'true' }}
          labels: |
            org.opencontainers.image.version=${{ steps.release.outputs.version }}

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VISLEX_VERSION=${{ steps.release.outputs.version }}
            VISLEX_REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
